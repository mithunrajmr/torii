<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrated Morphing Torii Gate Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= WIDGET WRAPPER ================= */
    .chat-widget-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    /* Zero-Gravity Levitation Physics */
    @keyframes float-launcher {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .levitate-wrapper {
      animation: float-launcher 4s ease-in-out infinite;
    }

    /* ================= MAIN MORPHING BUTTON ================= */
    .chat-launcher-btn {
      height: 64px;
      border-radius: 32px; /* Pill shape when wide, circle when 64x64 */
      background: linear-gradient(135deg, rgba(9, 81, 211, 0.25), rgba(0, 209, 172, 0.25));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 209, 172, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                  0 0 20px rgba(0, 209, 172, 0.2);
      transition: border-color 0.3s ease,
                  box-shadow 0.3s ease,
                  transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.3s ease;
      outline: none;
      overflow: hidden;
    }

    /* Button Hover & Active States */
    .chat-launcher-btn:hover {
      transform: scale(1.04);
      border-color: #00d1ac;
      background: linear-gradient(135deg, rgba(9, 81, 211, 0.35), rgba(0, 209, 172, 0.35));
      box-shadow: 0 12px 35px 0 rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(0, 209, 172, 0.5);
    }
    .chat-launcher-btn:active {
      transform: scale(0.98) !important;
    }

    /* ================= INTEGRATED EXPANDING TEXT ================= */
    .integrated-label {
      display: grid;
      grid-template-columns: 0fr;
      transition: grid-template-columns 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  margin 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.3s ease;
      opacity: 0;
      margin-left: 0;
      margin-right: 0;
    }
    /* Text expands smoothly out from the core when hovering the button */
    .chat-launcher-btn:hover .integrated-label {
      grid-template-columns: 1fr;
      opacity: 1;
      margin-left: 24px;
      margin-right: 4px;
    }
    .label-content {
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00d1ac;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d1ac;
      flex-shrink: 0;
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ================= LAUNCHER CORE (FIXED 64x64 RIGHT ICON) ================= */
    .launcher-core {
      width: 64px;
      height: 64px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    /* ================= OUTER CONCENTRIC HUD RINGS ================= */
    .orbital-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .hud-outer-ring {
      transform-origin: 32px 32px;
      animation: spin-clockwise 10s linear infinite;
      transition: animation-duration 0.3s;
    }
    .hud-inner-ring {
      transform-origin: 32px 32px;
      animation: spin-counter 6s linear infinite;
    }
    /* Rings spin faster on button hover */
    .chat-launcher-btn:hover .hud-outer-ring {
      animation-duration: 3s;
    }
    .chat-launcher-btn:hover .hud-inner-ring {
      animation-duration: 2s;
    }

    /* ================= CORE TOGGLE (OPEN vs CLOSED STATE) ================= */
    .icon-layer {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .icon-chat-core {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    .icon-close {
      opacity: 0;
      transform: scale(0.5) rotate(-90deg);
    }

    /* Active State Morphing (When Chat is Open) */
    .chat-launcher-btn.is-open .icon-chat-core {
      opacity: 0;
      transform: scale(0.5) rotate(90deg);
    }
    .chat-launcher-btn.is-open .icon-close {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    .chat-launcher-btn.is-open {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.25), rgba(239, 68, 68, 0.25));
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
    }

    /* ================= YOUR TORII GATE LOGO ANIMATIONS ================= */
    .torii-loader-svg {
      width: 36px;
      height: 36px;
      overflow: visible;
    }
    @keyframes loader-pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 5px rgba(0, 212, 170, 0.3));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 18px rgba(0, 212, 170, 0.85));
      }
    }
    .pulsing-gate {
      transform-origin: 400px 320px;
      animation: loader-pulse 2s ease-in-out infinite;
    }
    @keyframes loop-check {
      0% { stroke-dashoffset: 60; opacity: 0; }
      20% { stroke-dashoffset: 0; opacity: 1; }
      70% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -60; opacity: 0; }
    }
    .loading-check {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: loop-check 2s cubic-bezier(0.65, 0, 0.45, 1) infinite;
    }
    @keyframes portal-light {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .portal-bg {
      animation: portal-light 2s ease-in-out infinite;
    }
  </style>
</head>
<body>

<!-- WIDGET ANCHOR -->
<div class="chat-widget-container levitate-wrapper">
  
  <!-- Single Morphing Capsule Button -->
  <button class="chat-launcher-btn" id="chatBtn" onclick="toggleChat()" aria-label="Open Chat Assistant">
    
    <!-- Left Side: Integrated Expanding Label -->
    <div class="integrated-label">
      <div class="label-content">
        <div class="status-dot"></div>
        <span id="labelText">Portal Assistant Online</span>
      </div>
    </div>

    <!-- Right Side: Circular 64x64 HUD Core -->
    <div class="launcher-core">
      <!-- Outer Concentric HUD Rings -->
      <svg class="orbital-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0951d3" />
            <stop offset="100%" stop-color="#00d1ac" />
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(0, 209, 172, 0.15)" stroke-width="1" />
        <circle class="hud-outer-ring" cx="32" cy="32" r="28" fill="none" stroke="url(#hudGrad)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="25 15 10 15 5 15" />
        <circle class="hud-inner-ring" cx="32" cy="32" r="22" fill="none" stroke="#00d1ac" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="15 40 10 20" opacity="0.7" />
      </svg>

      <!-- STATE 1: YOUR TORII GATE LOADING LOGO -->
      <div class="icon-layer icon-chat-core">
        <svg class="torii-loader-svg" viewBox="100 80 600 480" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="mainGradient" x1="5%" y1="0%" x2="95%" y2="0%">
              <stop offset="0%" stop-color="#0951d3" />
              <stop offset="45%" stop-color="#00a3da" />
              <stop offset="100%" stop-color="#00d1ac" />
            </linearGradient>
            <linearGradient id="archGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#72eee0" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
            </linearGradient>
          </defs>

          <!-- CENTER PORTAL GLOW -->
          <path class="portal-bg" d="M 310,520 L 310,340 C 310,280 350,250 400,250 C 450,250 490,280 490,340 L 490,520 Z" fill="url(#archGradient)" />
          <path d="M 340,500 L 340,350 C 340,300 365,280 400,280 C 435,280 460,300 460,350 L 460,500 Z" fill="#ffffff" opacity="0.9" />

          <!-- TORII GATE -->
          <g class="pulsing-gate" fill="url(#mainGradient)">
            <polygon points="190,190 250,190 230,550 170,550" />
            <polygon points="550,190 610,190 630,550 570,550" />
            <rect x="150" y="235" width="500" height="36" rx="4" />
            <path d="M 120,150 L 680,150 L 670,185 L 130,185 Z" />
            <path d="M 70,85 C 260,145 540,145 730,85 C 705,130 685,140 670,155 L 130,155 C 115,140 95,130 70,85 Z" />
          </g>

          <!-- CENTER LOOPING CHECKMARK -->
          <circle cx="400" cy="390" r="28" fill="none" stroke="#00d1ac" stroke-width="8" opacity="0.3" />
          <polyline class="loading-check" points="385,390 395,400 418,377" fill="none" stroke="#00d1ac" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- STATE 2: Close (X) Icon -->
      <div class="icon-layer icon-close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>

  </button>
</div>

<script>
  let isOpen = false;
  function toggleChat() {
    isOpen = !isOpen;
    const btn = document.getElementById('chatBtn');
    const labelText = document.getElementById('labelText');
    const statusDot = document.querySelector('.status-dot');
    
    if (isOpen) {
      btn.classList.add('is-open');
      labelText.textContent = 'Close Assistant';
      statusDot.style.backgroundColor = '#ef4444';
      statusDot.style.boxShadow = '0 0 8px #ef4444';
    } else {
      btn.classList.remove('is-open');
      labelText.textContent = 'Portal Assistant Online';
      statusDot.style.backgroundColor = '#00d1ac';
      statusDot.style.boxShadow = '0 0 8px #00d1ac';
    }
  }
</script>

</body>
</html>
