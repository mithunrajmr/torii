<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torii Gate Loader Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px;
    }

    @keyframes toriiGatePulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(0, 209, 172, 0.35));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 14px rgba(0, 209, 172, 0.85));
      }
    }
    .torii-pulsing-gate {
      transform-origin: 400px 320px;
      animation: toriiGatePulse 2s ease-in-out infinite;
    }

    @keyframes toriiLoopCheck {
      0% { stroke-dashoffset: 60; opacity: 0; }
      20% { stroke-dashoffset: 0; opacity: 1; }
      70% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -60; opacity: 0; }
    }
    .torii-loading-check {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: toriiLoopCheck 2s cubic-bezier(0.65, 0, 0.45, 1) infinite;
    }

    @keyframes toriiPortalLight {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    .torii-portal-bg {
      animation: toriiPortalLight 2s ease-in-out infinite;
    }

    .card {
      padding: 28px 40px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Torii Gate Loader Component Showcase -->
  <div class="card bg-[#e8ecf2] text-slate-800 border-none shadow-[12px_12px_24px_#050810,-12px_-12px_24px_#111728]">
    <div class="text-[11px] font-bold tracking-widest text-slate-500 uppercase">Uploaded Document Image Loading State</div>
    
    <div class="neo-inset p-8 rounded-2xl w-full flex flex-col items-center justify-center space-y-3 bg-[#e8ecf2] border border-slate-200/60">
      <div style="width: 72px; height: 72px;" class="inline-block relative">
        <svg class="w-full h-full overflow-visible" viewBox="100 80 600 480" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="mainGradShowcase" x1="5%" y1="0%" x2="95%" y2="0%">
              <stop offset="0%" stop-color="#0951d3" />
              <stop offset="45%" stop-color="#00a3da" />
              <stop offset="100%" stop-color="#00d1ac" />
            </linearGradient>
            <linearGradient id="archGradShowcase" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#72eee0" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
            </linearGradient>
          </defs>

          <path class="torii-portal-bg" d="M 310,520 L 310,340 C 310,280 350,250 400,250 C 450,250 490,280 490,340 L 490,520 Z" fill="url(#archGradShowcase)" />
          <path d="M 340,500 L 340,350 C 340,300 365,280 400,280 C 435,280 460,300 460,350 L 460,500 Z" fill="#ffffff" opacity="0.9" />

          <g class="torii-pulsing-gate" fill="url(#mainGradShowcase)">
            <polygon points="190,190 250,190 230,550 170,550" />
            <polygon points="550,190 610,190 630,550 570,550" />
            <rect x="150" y="235" width="500" height="36" rx="4" />
            <path d="M 120,150 L 680,150 L 670,185 L 130,185 Z" />
            <path d="M 70,85 C 260,145 540,145 730,85 C 705,130 685,140 670,155 L 130,155 C 115,140 95,130 70,85 Z" />
          </g>

          <g>
            <circle cx="400" cy="405" r="28" fill="#ffffff" stroke="#00d1ac" stroke-width="6" />
            <polyline class="torii-loading-check" points="386,405 395,414 416,393" fill="none" stroke="#00d1ac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
      </div>
      <p class="text-xs text-slate-500 font-medium">Generating 5-min Signed Supabase URL...</p>
    </div>
  </div>

</body>
</html>
